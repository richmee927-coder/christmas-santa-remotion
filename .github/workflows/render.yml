name: Render Christmas Vertical

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Render video (Remotion)
        run: npx remotion render src/index.tsx ChristmasVertical out.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: christmas-vertical
          path: out.mp4
