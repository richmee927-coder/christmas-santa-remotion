name: Render Remotion

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
      - run: npm run typecheck

      - run: npx remotion render src/index.tsx MaxAndTheMoment out.mp4 --log=error